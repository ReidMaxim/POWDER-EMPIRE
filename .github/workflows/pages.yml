name: Deploy Powder Empire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the public build
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.PAGES_URL);
          if (!url.pathname.endsWith('/')) url.pathname += '/';
          for (let attempt = 1; ; attempt++) {
            try {
              const page = await fetch(url, { signal: AbortSignal.timeout(10000) });
              if (!page.ok) throw new Error(`Page returned HTTP ${page.status}`);
              const html = await page.text();
              if (!html.includes('<title>Powder Empire')) throw new Error('Unexpected page title');
              const paths = [...html.matchAll(/(?:src|href)="(\.\/(?:assets\/[^"]+|favicon\.png))"/g)];
              if (paths.length !== 3) throw new Error('Expected the script, stylesheet, and favicon');
              for (const [, path] of paths) {
                const asset = await fetch(new URL(path, url), { signal: AbortSignal.timeout(10000) });
                if (!asset.ok || asset.headers.get('content-type')?.includes('text/html')) {
                  throw new Error(`Invalid response for ${path}: HTTP ${asset.status}`);
                }
              }
              console.log(`Verified ${url}`);
              break;
            } catch (error) {
              if (attempt === 8) throw error;
              console.log(`Attempt ${attempt}: ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 7500));
            }
          }
          JS
